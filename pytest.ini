[pytest]
DJANGO_SETTINGS_MODULE = config.settings
addopts = --tb=short --doctest-glob='*.rst' --strict-markers
python_files = test_*.py
norecursedirs = venv VIRTUAL docs .* apps config
testpaths = tests/
xfail_strict = true

filterwarnings =
    default
    ignore:Plural value must be an integer, got float:DeprecationWarning:django.*trans_real
    ignore:codecs.open\(\) is deprecated:DeprecationWarning:compressor
    ignore::ResourceWarning
